<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial}

:root{
  --red:#e50914;
  --text:#fff;
  --muted:#aaa;
}

body{
  background: transparent !important;
  color:white;
  overflow-x:hidden;
}

/* Renderizado de alta calidad para imágenes */
img, video {
  image-rendering: -webkit-optimize-contrast;
  image-rendering: high-quality;
  transform: translateZ(0);
}

/* Video fijo en el fondo abarcando toda la pantalla */
#bg-video,
.global-bg-video {
  position: fixed;
  top: 0;
  left: 0;
  min-width: 100%;
  min-height: 100%;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  object-fit: cover;
  filter: brightness(0.65); /* Un poco más de brillo para que se aprecie mejor */
  backface-visibility: hidden;
  pointer-events: none; /* Evita interferencias con eventos táctiles e inputs */
}

/* Cero fondos, cero cajas grises, cero bordes para una transparencia 100% real */
body,
.sidebar,
.main-container,
.app,
.card,
.song-card,
.row,
.artist-card,
.hero,
button,
.btn,
.nav-item,
.content,
.topbar,
.page {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  outline: none !important;
  backdrop-filter: none !important;
}

button, .btn {
  background-color: transparent !important;
  border: 0 !important;
  outline: none !important;
  color: #fff;
  cursor: pointer;
}

.hidden{display:none!important}

.splash{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:16px;
  background:transparent !important;
}

.splash img{
  width:170px;
  height:170px;
  object-fit:contain;
  border-radius:18px;
}

.splash h1{
  font-size:56px;
  color:#fff;
  letter-spacing:1px;
  text-shadow: 0 4px 10px rgba(0,0,0,0.9);
}

.splash h1::after{
  content:"";
  display:block;
  width:150px;
  height:5px;
  background:var(--red);
  border-radius:20px;
  margin:8px auto 0;
}

.splash p{
  color:#ddd;
  text-shadow: 0 2px 5px rgba(0,0,0,0.9);
}

button:hover{
  filter:brightness(1.2);
  transform:translateY(-1px);
}

.back-btn{
  margin-bottom:18px;
}

.app{
  display:grid;
  grid-template-columns:240px 1fr;
  min-height:100vh;
  padding-bottom:96px;
}

.sidebar{
  padding:20px;
  position:sticky;
  top:0;
  height:100vh;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:25px;
}

.brand img{
  width:45px;
  height:45px;
  object-fit:contain;
  border-radius:10px;
}

.brand h2{
  font-size:24px;
  text-shadow: 0 2px 5px rgba(0,0,0,0.9);
}

.sidebar button{
  display:block;
  width:100%;
  margin:10px 0;
  text-align:left;
  padding:12px 18px;
  border-radius:14px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.9);
  font-size: 15px;
  font-weight: 600;
}

.sidebar button:hover{
  background: rgba(255, 255, 255, 0.1) !important;
}

.content{padding:25px}

.topbar input{
  width:100%;
  padding:15px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.3) !important;
  background: rgba(0, 0, 0, 0.3) !important;
  color:white;
  margin-bottom:25px;
  outline:none;
}

.topbar input:focus{border-color:var(--red) !important}

.page{display:none}
.page.active{display:block}

.hero{
  padding:20px 0;
  margin-bottom:15px;
}

.hero h1{
  font-size:36px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
}
.hero p,.muted{
  color:#ddd;
  text-shadow: 0 2px 4px rgba(0,0,0,0.9);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:18px;
}

.card{
  padding:8px;
  cursor:pointer;
  transition:.25s;
}

.card:hover{
  transform:scale(1.03);
}

.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:14px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.6) !important;
}

.card h3{
  font-size:16px;
  margin:10px 0 2px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.9);
}

.card p{
  color:#ccc;
  font-size: 13px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.9);
}

.list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px;
  cursor:pointer;
  text-shadow: 0 2px 4px rgba(0,0,0,0.9);
  border-radius: 12px;
}

.row:hover {
  background: rgba(255, 255, 255, 0.08) !important;
}

.row img{
  width:60px;
  height:60px;
  border-radius:12px;
  object-fit:cover;
}

.artists-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:18px;
}

.artist-card{
  padding:16px;
  text-align:center;
  cursor:pointer;
  transition:.25s;
  text-shadow: 0 2px 4px rgba(0,0,0,0.9);
}

.artist-card:hover{
  transform:scale(1.04);
}

.artist-card img{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:10px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.6) !important;
}

.artist-card h3{font-size:16px}

.artist-title{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.artist-title img{
  width:85px;
  height:85px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--red) !important;
}

/* Reproductor inferior sutilmente oscurecido solo para lectura */
.player{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.6)) !important;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 18px;
  z-index:99;
}

.player img{
  width:62px;
  height:62px;
  border-radius:12px;
  object-fit:cover;
}

.player-info{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:5px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.9);
}

.player-info span{color:var(--muted)}

.player button{
  border-radius:50%;
  padding:10px 13px;
}

#progress{
  width:100%;
  accent-color:var(--red);
}

#timeInfo{
  font-size:12px;
  color:#ddd;
}

.volume-box{
  display:flex;
  align-items:center;
  gap:6px;
}

.back-to-top{
  position:fixed;
  right:24px;
  bottom:115px;
  width:48px;
  height:48px;
  border-radius:50%;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  line-height:1;
  z-index:98;
  opacity:0;
  visibility:hidden;
  transform:translateY(12px);
  transition:opacity .25s ease, visibility .25s ease, transform .25s ease;
}

.back-to-top.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

.ad-slot{
  width:100%;
  min-height:90px;
  margin-top:28px;
  padding:10px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.ad-slot:empty::before{
  content:"PUBLICIDAD";
  color:#aaa;
  font-size:11px;
  letter-spacing:1px;
}

#volume{
  width:120px;
  accent-color:var(--red);
}

#volumeText{
  font-size:13px;
  color:#ddd;
  min-width:45px;
}

@media(max-width:800px){
  .app{grid-template-columns:1fr}

  .sidebar{
    position:fixed;
    bottom:0;
    top:auto;
    left:0;
    right:0;
    height:65px;
    display:flex;
    overflow:auto;
    z-index:100;
    padding:7px;
    background: rgba(0,0,0,0.85) !important;
  }

  .brand{display:none}

  .sidebar button{
    min-width:100px;
    font-size:12px;
    margin:0;
  }

  .content{padding:15px 12px 160px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .player{bottom:65px;padding:8px}
  .ad-slot{display:none}
  .back-to-top{
    right:14px;
    bottom:145px;
    width:46px;
    height:46px;
  }
  #volume{width:80px}
  #volumeText{font-size:11px;min-width:38px}
  .splash h1{font-size:42px}
  .artist-card img{width:105px;height:105px}
}

/* LOGIN 100% TRANSPARENTE */
.login-screen{
  position:fixed; 
  inset:0; 
  z-index:9999; 
  display:flex; 
  flex-direction:column;
  align-items:center; 
  justify-content:center;
  background:transparent !important;
  overflow:hidden; 
  opacity:1; 
  visibility:visible; 
  transition:opacity .45s ease,visibility .45s ease;
}

.login-screen.hidden-login{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.login-brand-full{
  font-size: 42px;
  font-weight: 800;
  letter-spacing: 3px;
  margin-bottom: 6px;
  text-shadow: 0 4px 15px rgba(0,0,0,0.9);
  text-align: center;
}

.login-brand-full span{
  color: var(--red);
}

.login-sub{
  font-size: 15px;
  color: #ddd;
  margin-bottom: 25px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  text-align: center;
}

.login-form-full{
  display:flex;
  flex-direction:column;
  gap:14px;
  width:100%;
  max-width:340px;
}

.login-form-full input{
  padding:14px 18px;
  border:1px solid rgba(255,255,255,0.4) !important;
  border-radius:12px;
  background:rgba(0,0,0,0.4) !important;
  color:#fff;
  outline:none !important;
  font-size:15px;
  text-align:center;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}

.login-form-full input::placeholder{
  color: #ccc;
}

.login-form-full input:focus{
  border-color:var(--red) !important;
  background:rgba(0,0,0,0.6) !important;
}

.login-form-full button{
  padding:15px;
  background:var(--red) !important;
  color:#fff;
  cursor:pointer;
  font-weight:800;
  border-radius:12px;
  font-size:15px;
  letter-spacing: 1px;
  transition:0.2s;
  box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4) !important;
}

.login-form-full button:hover{
  filter:brightness(1.2);
  transform: translateY(-2px);
}

.login-status{
  min-height:22px;
  text-align:center;
  font-size:13px;
  color:#ff5252;
  font-weight: 600;
  text-shadow: 0 2px 6px rgba(0,0,0,0.9);
}

.login-status.ok{
  color:#00ff66;
}
</style>

<!-- Video de fondo principal para toda la app -->
<video id="bg-video" class="global-bg-video" autoplay loop muted playsinline>

</video>

<div id="splash" class="splash">

  <button id="enterBtn" style="font-size: 18px; font-weight: bold; padding: 12px 30px; background: var(--red) !important; border-radius: 12px;">Entrar</button>
</div>

<!-- VISTA COMPLETA TRANSPARENTE: USUARIO, CONTRASEÑA Y KEY -->
<section id="loginScreen" class="login-screen hidden-login" aria-hidden="true">
  <div class="login-brand-full"><span>BL</span> MUSIC</div>
  <p class="login-sub">Ingresa tus datos y tu clave de producto para ingresar</p>

  <form class="login-form-full" id="blLoginForm">
    <input id="userName" type="text" placeholder="Usuario" autocomplete="off" required>
    <input id="userPassword" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <input id="licenseKey" type="text" placeholder="XXXX-XXXX-XXXX" autocomplete="off" required>
    <button type="submit">ACTIVAR Y ENTRAR</button>
    <p id="loginStatus" class="login-status"></p>
  </form>
</section>

<main id="app" class="app main-container hidden">
  <aside class="sidebar">
    <div class="brand">
      <img src="logo.png" onerror="this.style.display='none'">
      <h2>Bolito MUSIC</h2>
    </div>

    <button data-page="home" class="btn nav-item">🏠 Inicio</button>
    <button data-page="search" class="btn nav-item">🔎 Buscar</button>
    <button data-page="artists" class="btn nav-item">👤 Artistas</button>
    <button data-page="favorites" class="btn nav-item">💜 Favoritos</button>
    <button data-page="library" class="btn nav-item">📚 Biblioteca</button>

    <div class="ad-slot"></div>
  </aside>

  <section class="content">
    <div class="topbar">
      <input id="searchInput" placeholder="Buscar canción, artista o género...">
    </div>

    <section id="home" class="page active">
      <div class="hero">
        <h1>Bolito</h1>
        <p>Reproduce tus canciones locales</p>
      </div>

      <h2>Canciones (116)</h2><br>
      <div id="songsGrid" class="grid"></div>
    </section>

    <section id="search" class="page">
      <h1>Buscar</h1><br>
      <div id="searchResults" class="list"></div>
    </section>

    <section id="artists" class="page">
      <button id="backFromArtists" class="back-btn btn">⬅ Retroceder</button>
      <h1>Artistas</h1><br>
      <div id="artistsGrid" class="artists-grid"></div>
    </section>

    <section id="favorites" class="page">
      <h1>Favoritos</h1><br>
      <div id="favoritesList" class="list"></div>
    </section>

    <section id="library" class="page">
      <h1>Biblioteca</h1>
      <p class="muted">Tus canciones guardadas localmente.</p>
    </section>
  </section>
</main>

<div id="player" class="player player-bar hidden">
  <img id="playerCover">

  <div class="player-info">
    <b id="playerTitle">Canción</b>
    <span id="playerArtist">Artista</span>
    <input id="progress" type="range" min="0" max="100" value="0">
    <div id="timeInfo">0:00 / 0:00</div>
  </div>

  <button id="prevBtn" class="btn">⏮</button>
  <button id="playBtn" class="btn">▶</button>
  <button id="nextBtn" class="btn">⏭</button>
  <button id="favBtn" class="btn">♡</button>

  <div class="volume-box">
    <input id="volume" type="range" min="0" max="100" step="1" value="100">
    <span id="volumeText">100%</span>
  </div>
</div>

<audio id="audio"></audio>

<button id="backToTop" class="back-to-top btn" aria-label="Volver arriba" title="Volver arriba">↑</button>

  setTimeout(() => $("userName").focus(), 300);
};

$("blLoginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  
  const user = $("userName").value.trim();
  const pass = $("userPassword").value.trim();
  const key = $("licenseKey").value.trim().toUpperCase();
  const status = $("loginStatus");

  if (!user || !pass || !key) {
    status.textContent = "Por favor completa los 3 campos.";
    status.className = "login-status";
    return;
  }

  status.textContent = "Verificando clave...";
  status.className = "login-status";

  // VALIDACIÓN DE KEYS
  if (!VALID_KEYS.has(key)) {
    status.textContent = "La clave ingresada no es válida.";
    return;
  }

  let usedKeys = JSON.parse(localStorage.getItem("bl_music_used_keys") || "{}");

  if (usedKeys[key] && usedKeys[key] !== user) {
    status.textContent = "Esta clave ya fue usada en otro dispositivo.";
    return;
  }

  try {
    if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
      const db = firebase.firestore();
      const docRef = db.collection("licencias").doc(key);
      const doc = await docRef.get();

      if (!doc.exists) {
        status.textContent = "La licencia no existe o es incorrecta.";
        return;
      }

      const data = doc.data();

      if (data.usada && data.usuarioActivador !== user) {
        status.textContent = "Esta licencia ya se activó en otro dispositivo.";
        return;
      }

      await docRef.update({
        usada: true,
        usuarioActivador: user,
        fechaActivacion: new Date().toISOString()
      });
    }

    usedKeys[key] = user;
    localStorage.setItem("bl_music_used_keys", JSON.stringify(usedKeys));

    localStorage.setItem("bl_music_license_active", key);
    localStorage.setItem("bl_music_user", user);

    status.textContent = "¡Acceso concedido!";
    status.className = "login-status ok";
    
    setTimeout(() => enterMusic(key), 800);

  } catch (err) {
    console.error(err);
    status.textContent = "Error al conectar con el servidor.";
  }
});

function renderSongs(list){
  $("songsGrid").innerHTML = "";

  list.forEach((song,i)=>{

      <h3>${song.title}</h3>
      <p>${song.artist}</p>
    `;
    card.onclick=()=>playSong(i,false);
    $("songsGrid").appendChild(card);
  });
}

function renderRows(list,container){
  container.innerHTML="";

  if(list.length===0){
    container.innerHTML="<p class='muted'>No hay resultados.</p>";
    return;
  }

  list.forEach(song=>{
    const i=songs.indexOf(song);
    const row=document.createElement("div");
    row.className="row";
    row.innerHTML=`
      <img src="${song.coverUrl}" loading="lazy" onerror="this.src='logo.png'">
      <div style="flex:1">
        <b>${song.title}</b><br>
        <span class="muted">${song.artist} • ${song.genre}</span>
      </div>
      <button class="btn">▶</button>
    `;
    row.onclick=()=>playSong(i,false);
    container.appendChild(row);
  });
}

function getArtistSongs(artist){
  return songs.filter(song =>
    song.artist.toLowerCase().includes(artist.name.toLowerCase()) ||
    artist.name.toLowerCase().includes(song.artist.toLowerCase())
  );
}

function playSong(i,isAuto=false){
  if(!songs[i]) return;

  autoMode = isAuto;
  currentIndex = i;
  const song = songs[i];

  $("player").classList.remove("hidden");
  $("playerCover").src = song.coverUrl;
  $("playerTitle").textContent = song.title;
  $("playerArtist").textContent = song.artist;
  
  if ("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
        title: song.title,
        artist: song.artist,
        album: "Bolito MUSIC",
        artwork: [
          {
            src: new URL(song.coverUrl, window.location.href).href,
            sizes: "512x512",
            type: "image/png"
          }
        ]
    });

    navigator.mediaSession.setActionHandler("play", ()=>audio.play());
    navigator.mediaSession.setActionHandler("pause", ()=>audio.pause());

    navigator.mediaSession.setActionHandler("nexttrack", ()=>{
        currentIndex++;
        if(currentIndex>=songs.length){ currentIndex=0; }
        playSong(currentIndex,false);
    });

    navigator.mediaSession.setActionHandler("previoustrack", ()=>{
        currentIndex--;
        if(currentIndex<0){ currentIndex=songs.length-1; }
        playSong(currentIndex,false);
    });
  }

  $("favBtn").textContent = favorites.includes(song.title) ? "♥" : "♡";
  $("playBtn").textContent = "⏳";
  $("timeInfo").textContent = "0:00 / 0:00";
  $("progress").value = 0;

  audio.pause();
  audio.src = song.audioUrl;
  audio.load();

  audio.play().then(()=>{
    $("playBtn").textContent = "⏸";
  }).catch(error=>{
    console.log("No se pudo reproducir:", song.audioUrl, error);
    $("playBtn").textContent = "▶";

    if(isAuto){
      playRandomSong();
    }else{
      alert("No se pudo reproducir esta canción. Revisa que exista exactamente:\n" + song.audioUrl);
    }
  });
}

function randomSong(){
  if(songs.length <= 1) return currentIndex;

  let next;
  do{
    next = Math.floor(Math.random() * songs.length);
  }while(next === currentIndex);

  return next;
}

function playRandomSong(){
  playSong(randomSong(),true);
}

$("playBtn").onclick=()=>{
  if(audio.paused){
    audio.play().then(()=>{
      $("playBtn").textContent="⏸";
    }).catch(()=>{
      alert("Selecciona una canción manualmente.");
    });
  }else{
    audio.pause();
    $("playBtn").textContent="▶";
  }
};

$("nextBtn").onclick = () => {
    currentIndex++;
    if(currentIndex >= songs.length){ currentIndex = 0; }
    playSong(currentIndex,false);
};

$("prevBtn").onclick = () => {
    currentIndex--;
    if(currentIndex < 0){ currentIndex = songs.length-1; }
    playSong(currentIndex,false);
};

$("volume").oninput=e=>{
  const vol = Number(e.target.value);
  $("volumeText").textContent = vol + "%";
  audio.volume = Math.min(vol / 100, 1);
};

audio.ontimeupdate=()=>{
  if(audio.duration){
    $("progress").value=(audio.currentTime/audio.duration)*100;
    $("timeInfo").textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
  }else{
    $("timeInfo").textContent = "0:00 / 0:00";
  }
};

function formatTime(seconds){
  if(!seconds || isNaN(seconds)) return "0:00";
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return mins + ":" + secs.toString().padStart(2,"0");
}

$("progress").oninput=e=>{
  if(audio.duration){
    audio.currentTime=(e.target.value/100)*audio.duration;
  }
};

audio.onended = () => {
  currentIndex++;
  if(currentIndex >= songs.length){ currentIndex = 0; }
  playSong(currentIndex,true);
};

audio.onerror = () => {
  if(!songs[currentIndex]) return;
  $("playBtn").textContent = "▶";

  if(autoMode){
    playRandomSong();
  }else{
    alert("No se pudo reproducir esta canción. Revisa que exista exactamente:\n" + songs[currentIndex].audioUrl);
  }
};

$("favBtn").onclick=()=>{
  const title=songs[currentIndex].title;

  if(favorites.includes(title)){
    favorites=favorites.filter(x=>x!==title);
  }else{
    favorites.push(title);
  }

  localStorage.setItem("spoti_favorites",JSON.stringify(favorites));
  $("favBtn").textContent=favorites.includes(title)?"♥":"♡";
};

function renderFavorites(){
  const favSongs=songs.filter(s=>favorites.includes(s.title));
  renderRows(favSongs,$("favoritesList"));
}

    backToTop.classList.add("show");

backToTop.onclick=()=>{

$("searchInput").oninput=e=>{
  const text=e.target.value.toLowerCase();

  const filtered=songs.filter(s=>
    s.title.toLowerCase().includes(text) ||
    s.artist.toLowerCase().includes(text) ||
    s.genre.toLowerCase().includes(text)
  );

  resetSearchPage();
  renderRows(filtered,$("searchResults"));

  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  $("search").classList.add("active");
};
